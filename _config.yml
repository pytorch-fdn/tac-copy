title: PyTorch Foundation TAC
description: Materials and processes for the PyTorch Foundation Technical Advisory Council
logo: "/PyTorchFLogo_Horiz_fullColor.svg"
theme: just-the-docs
repository: pytorch-fdn/tac-copy

# Working-copy GitHub Pages address
url: "https://pytorch-fdn.github.io"
baseurl: "/tac-copy"

exclude: [
  "README.md",
  "completed.md",
  "dco-signoffs/",
  "Gemfile",
  "Gemfile.lock",
  "package.json",
  "package-lock.json",
  "CODE_OF_CONDUCT.md",
  "LICENSE",
  "vendor"
]

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/pytorch-fdn/tac-copy"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Various URLs used across the site
# Empty values need confirmed PyTorch destinations.
landscape_url: ""
landscape_project_embed_uri: ""
calendar_url: ""
slack_url: ""
directed_fund_charter_url: ""
tac_issues_url: "https://github.com/pytorch-fdn/tac/issues"
helpdesk_url: ""
mailing_list_url: ""
wiki_url: ""
lfx_insights_url: ""
tac_mailing_list_url: ""
tac_mailing_list_email: ""
tac_private_mailing_list_email: ""
leads_mailing_list_email: ""
website_url: ""
blog_url: ""
tac_lfx_meeting_url: ""
lfscanning_repo_url: ""
tac_member_list_url: ""
tac_meeting_agenda_url: ""
lf_staff_list_url: ""
mission_statement_url: ""
tac_agenda_url: ""
artwork_url: ""
election_guidelines_url: ""

# Foundation Settings
foundation_name: "PyTorch Foundation"
foundation_benefits: ""

# Integration identifier: confirm before enabling.
clotributor_name: ""

# Governance settings: populate from approved PyTorch documents.
membership_top_tier: ""
vote_of_tac_committee_title: ""
vote_of_tac_committee_count: 0
archived_lifecycle_stage: ""
tac_projects: []
project_types: []

# Add a confirmed support destination later.
aux_links: {}

footer_content: Copyright &copy; The Linux Foundation&reg;. All rights reserved. The Linux Foundation has registered trademarks and uses trademarks. For a list of trademarks of The Linux Foundation, please see our <a href="https://www.linuxfoundation.org/trademark-usage">Trademark Usage</a> page. Linux is a registered trademark of Linus Torvalds. <a href="https://www.linuxfoundation.org/privacy">Privacy Policy</a> and <a href="https://www.linuxfoundation.org/terms">Terms of Use</a>.

readme_index:
  with_frontmatter: true

# ASWF analytics settings removed.
# Add a PyTorch-owned tracking ID if required.

kramdown:
  input: GFM
  extensions:
    - autolink
  parse_block_html: true
  toc_levels: 2..6
  gfm_quirks: [paragraph_end]

plugins:
  - jekyll-redirect-from

mermaid:
  version: "10.9.0"

callouts:
  note:
    title: Note
    color: blue

defaults:
  -
    scope:
      path: "meetings/*/README.md"
      type: "pages"
    values:
      title: My Title
      parent: Meetings
